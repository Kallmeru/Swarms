name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package as a user would
        run: pip install ".[server,llm,dev]"

      - run: python -m pytest tests
      - run: python -m pyflakes swarms tests

      - name: Examples still run
        run: |
          python examples/quickstart.py
          python examples/tool_calling_loop.py

      - name: Policy validates
        run: swarms policy check --policy swarms/default_policy.yaml --strict

      # --strict fails the build if any attack got through, any legitimate task
      # was refused, or any fixture stopped landing against an unprotected
      # pipeline. A regression in the security property breaks CI instead of
      # quietly changing a number in the README.
      - name: Red-team suite
        run: swarms redteam --policy swarms/default_policy.yaml --strict

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-${{ matrix.python-version }}
          path: redteam-report.json
          if-no-files-found: ignore

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # Install the built wheel into a clean environment and use it from a
      # directory that is not the repo, which is the only way to catch package
      # data (the default policy, the corpus) that was never actually shipped.
      - name: The wheel works outside the source tree
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/venv/bin/swarms version
          /tmp/venv/bin/swarms policy check
          /tmp/venv/bin/swarms redteam --strict

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t swarms:ci .
      - name: It refuses to start unauthenticated in production
        run: |
          if docker run --rm -e SWARMS_ENV=production swarms:ci \
             python -c "from swarms.server.app import create_app; create_app()"; then
            echo "started without API keys in production mode, which must not happen"
            exit 1
          fi
      - name: It serves and answers health
        run: |
          docker run -d --name swarms-ci -p 8000:8000 -e SWARMS_API_KEYS=ci-key:ci:admin swarms:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          docker rm -f swarms-ci
