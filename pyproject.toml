[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The import name is `swarms`; the distribution name is `swarms-guard` because
# `swarms` is already taken on PyPI by an unrelated project.
name = "swarms-guard"
version = "2.0.0"
description = "Policy enforcement for AI agent tool calls: taint tracking, capability control, audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Paru", email = "noreply@users.noreply.github.com" },
    { name = "Ablaze", email = "noreply@users.noreply.github.com" },
    { name = "Dipesh Ray", email = "ray-d@ulster.ac.uk" },
]
keywords = ["ai", "agents", "security", "prompt-injection", "llm", "authorization", "policy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

# The SDK is what most people install, so its dependency list is one small
# YAML parser. The gateway, the console and the live-model agents are extras,
# because a library that pulls a web framework into an application that only
# wants the decision function has mispriced itself.
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
llm = ["requests>=2.28"]
dev = [
    "pytest>=7.0",
    "httpx>=0.27",
    "pyflakes>=3.0",
    "build>=1.0",
]
all = ["swarms-guard[server,llm,dev]"]

[project.scripts]
swarms = "swarms.cli:main"

[project.urls]
Homepage = "https://github.com/Kallmeru/Swarms"
Source = "https://github.com/Kallmeru/Swarms"
Issues = "https://github.com/Kallmeru/Swarms/issues"

[tool.setuptools.packages.find]
include = ["swarms*"]

[tool.setuptools.package-data]
swarms = ["default_policy.yaml"]
"swarms.redteam" = ["corpus.json", "corpus/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
